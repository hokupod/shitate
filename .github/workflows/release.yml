name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to release from the selected ref
        required: true
        type: string

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  gate:
    runs-on: macos-26
    outputs:
      commit: ${{ steps.gate.outputs.commit }}
      tag: ${{ steps.gate.outputs.tag }}
      tag_object: ${{ steps.gate.outputs.tag_object }}
      version: ${{ steps.gate.outputs.version }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Validate protected release trigger
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_VERSION: ${{ inputs.version }}
          SHITATE_IMMUTABLE_RELEASE_TAGS: ${{ vars.SHITATE_IMMUTABLE_RELEASE_TAGS }}
          SHITATE_RELEASE_TAGGER_EMAIL: ${{ vars.SHITATE_RELEASE_TAGGER_EMAIL }}
        run: |
          set -euo pipefail
          source scripts/lib/version.sh
          [[ "$SHITATE_IMMUTABLE_RELEASE_TAGS" == YES ]]
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag=${GITHUB_REF_NAME}
            [[ "$tag" == v* ]]
            version=${tag#v}
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version=$MANUAL_VERSION
            tag="v$version"
          else
            printf 'unsupported release event: %s\n' "$GITHUB_EVENT_NAME" >&2
            exit 1
          fi
          shitate_require_publishable_version "$version"
          is_prerelease=$SHITATE_VERSION_IS_PRERELEASE
          shitate_read_version_contract "$GITHUB_WORKSPACE"
          [[ "$version" == "$SHITATE_VERSION" ]]
          tag_ref="$RUNNER_TEMP/shitate-release-tag-ref.json"
          tag_object="$RUNNER_TEMP/shitate-release-tag-object.json"
          trap 'rm -f "$tag_ref" "$tag_object"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >"$tag_ref"
          tag_sha=$(jq -r '.object.sha' "$tag_ref")
          [[ "$tag_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" >"$tag_object"
          ./scripts/validate-release-tag.sh \
            "$tag" "$GITHUB_SHA" "$SHITATE_RELEASE_TAGGER_EMAIL" \
            "$tag_ref" "$tag_object"
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'release already exists and will not be overwritten: %s\n' "$tag" >&2
            exit 1
          fi
          printf 'commit=%s\ntag=%s\ntag_object=%s\nversion=%s\nprerelease=%s\n' \
            "$GITHUB_SHA" "$tag" "$tag_sha" "$version" "$is_prerelease" \
            >>"$GITHUB_OUTPUT"

  test:
    needs: gate
    runs-on: macos-26
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31

      - name: Build and test before release authority
        run: |
          nix develop -c ./scripts/bootstrap.sh
          nix develop -c ./scripts/check-format.sh
          nix develop -c ./scripts/configure.sh ci
          nix develop -c ./scripts/build.sh ci
          nix develop -c ./scripts/test.sh ci

  release:
    needs:
      - gate
      - test
    environment: release
    runs-on: macos-26
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      SHITATE_ARTIFACT_DIR: ${{ github.workspace }}/../shitate-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
      SHITATE_DMG: ${{ github.workspace }}/../shitate-artifacts-${{ github.run_id }}-${{ github.run_attempt }}/Shi-tate_${{ needs.gate.outputs.version }}_arm64.dmg
      SHITATE_DMG_SHA256: ${{ github.workspace }}/../shitate-artifacts-${{ github.run_id }}-${{ github.run_attempt }}/Shi-tate_${{ needs.gate.outputs.version }}_arm64.dmg.sha256
      SHITATE_SOURCE_ARCHIVE: ${{ github.workspace }}/../shitate-artifacts-${{ github.run_id }}-${{ github.run_attempt }}/shitate-${{ needs.gate.outputs.version }}-source.tar.zst
      SHITATE_SOURCE_SHA256: ${{ github.workspace }}/../shitate-artifacts-${{ github.run_id }}-${{ github.run_attempt }}/shitate-${{ needs.gate.outputs.version }}-source.tar.zst.sha256
      SHITATE_PROVENANCE: ${{ github.workspace }}/../shitate-artifacts-${{ github.run_id }}-${{ github.run_attempt }}/provenance.json
      SHITATE_NOTICES: ${{ github.workspace }}/THIRD_PARTY_NOTICES.md
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@b4b293eae0b79aac8a161bb32925a5508c9cca93 # v31

      - name: Initialize empty release artifact directory
        run: |
          set -euo pipefail
          expected="$GITHUB_WORKSPACE/../shitate-artifacts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$SHITATE_ARTIFACT_DIR" == "$expected" ]]
          mkdir "$SHITATE_ARTIFACT_DIR"

      - name: Build release and verify corresponding source
        run: |
          nix develop -c ./scripts/bootstrap.sh
          nix develop -c ./scripts/configure.sh release
          nix develop -c ./scripts/build.sh release
          nix develop -c ./scripts/make-source-archive.sh "$VERSION"
          nix develop -c ./scripts/verify-source-archive.sh \
            "$SHITATE_ARTIFACT_DIR/shitate-$VERSION-source.tar.zst"

      - name: Sign, notarize, staple, and package
        env:
          SHITATE_ALLOW_NOTARIZATION: YES
          SHITATE_ALLOW_SIGNING: YES
          SHITATE_CERTIFICATE_P12_BASE64: ${{ secrets.SHITATE_CERTIFICATE_P12_BASE64 }}
          SHITATE_CERTIFICATE_PASSWORD: ${{ secrets.SHITATE_CERTIFICATE_PASSWORD }}
          SHITATE_KEYCHAIN_PASSWORD: ${{ secrets.SHITATE_KEYCHAIN_PASSWORD }}
          SHITATE_NOTARY_ISSUER_ID: ${{ secrets.SHITATE_NOTARY_ISSUER_ID }}
          SHITATE_NOTARY_KEY_BASE64: ${{ secrets.SHITATE_NOTARY_KEY_BASE64 }}
          SHITATE_NOTARY_KEY_ID: ${{ secrets.SHITATE_NOTARY_KEY_ID }}
          SHITATE_RELEASE_MODE: developer-id
          SHITATE_SIGNING_IDENTITY: ${{ vars.SHITATE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          source scripts/lib/apple-credentials.sh
          credential_root="$RUNNER_TEMP/shitate-release-credentials"
          trap shitate_cleanup_apple_credentials EXIT
          shitate_prepare_apple_credentials "$credential_root"
          shitate_validate_apple_credentials "$credential_root"
          app="$GITHUB_WORKSPACE/build/release/Release/Shi-tate.app"
          nix develop -c ./scripts/sign-release.sh "$app"
          nix develop -c ./scripts/verify-release.sh "$app"
          nix develop -c ./scripts/notarize.sh "$app"
          SHITATE_DEFER_HASH=YES nix develop -c ./scripts/package.sh release
          nix develop -c ./scripts/notarize.sh "$SHITATE_DMG"
          nix develop -c ./scripts/hash-artifact.sh "$SHITATE_DMG"
          nix develop -c ./scripts/verify-release.sh "$app"
          spctl --assess --type execute --verbose=4 "$app"
          spctl --assess --type open --context context:primary-signature \
            --verbose=4 "$SHITATE_DMG"

      - name: Create local provenance statement
        run: |
          nix develop -c ./scripts/make-provenance.sh \
            "$SHITATE_PROVENANCE" \
            "$SHITATE_DMG" \
            "$SHITATE_SOURCE_ARCHIVE" \
            "$SHITATE_NOTICES"

      - name: Attest release subjects
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.SHITATE_DMG }}
            ${{ env.SHITATE_DMG_SHA256 }}
            ${{ env.SHITATE_SOURCE_ARCHIVE }}
            ${{ env.SHITATE_SOURCE_SHA256 }}
            ${{ env.SHITATE_PROVENANCE }}
            ${{ env.SHITATE_NOTICES }}

      - name: Create draft release exactly once
        env:
          EXPECTED_COMMIT: ${{ needs.gate.outputs.commit }}
          EXPECTED_TAG_OBJECT: ${{ needs.gate.outputs.tag_object }}
          GH_TOKEN: ${{ github.token }}
          SHITATE_IMMUTABLE_RELEASE_TAGS: ${{ vars.SHITATE_IMMUTABLE_RELEASE_TAGS }}
          SHITATE_RELEASE_TAGGER_EMAIL: ${{ vars.SHITATE_RELEASE_TAGGER_EMAIL }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$SHITATE_IMMUTABLE_RELEASE_TAGS" == YES ]]
          if gh release view "$TAG" >/dev/null 2>&1; then
            printf 'release already exists and will not be overwritten: %s\n' "$TAG" >&2
            exit 1
          fi
          [[ $(git rev-parse HEAD) == "$EXPECTED_COMMIT" ]]
          tag_ref="$RUNNER_TEMP/shitate-release-final-tag-ref.json"
          tag_object="$RUNNER_TEMP/shitate-release-final-tag-object.json"
          trap 'rm -f "$tag_ref" "$tag_object"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >"$tag_ref"
          live_tag_sha=$(jq -r '.object.sha' "$tag_ref")
          [[ "$live_tag_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$live_tag_sha" >"$tag_object"
          ./scripts/validate-release-tag.sh \
            "$TAG" "$EXPECTED_COMMIT" "$SHITATE_RELEASE_TAGGER_EMAIL" \
            "$tag_ref" "$tag_object" "$EXPECTED_TAG_OBJECT"
          arguments=(release create "$TAG" --draft --verify-tag \
            --title "Shi-tate $VERSION" \
            --notes "Draft release generated from verified release gates.")
          if [[ "${{ needs.gate.outputs.prerelease }}" == true ]]; then
            arguments+=(--prerelease)
          fi
          gh "${arguments[@]}" \
            "$SHITATE_DMG" \
            "$SHITATE_DMG_SHA256" \
            "$SHITATE_SOURCE_ARCHIVE" \
            "$SHITATE_SOURCE_SHA256" \
            "$SHITATE_PROVENANCE" \
            "$SHITATE_NOTICES"
