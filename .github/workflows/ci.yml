name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  format:
    runs-on: macos-26
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify toolchain and dependency pins
        run: ./scripts/bootstrap.sh

      - name: Check formatting and static policy
        run: ./scripts/check-format.sh ci

  build-and-test:
    runs-on: macos-26
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify toolchain and dependency pins
        run: ./scripts/bootstrap.sh

      - name: Configure
        run: ./scripts/configure.sh ci

      - name: Build
        run: ./scripts/build.sh ci

      - name: Test
        run: ./scripts/test.sh ci
