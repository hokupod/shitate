name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  format:
    runs-on: macos-26
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Verify toolchain and dependency pins
        run: nix develop -c ./scripts/bootstrap.sh

      - name: Check formatting and static policy
        run: nix develop -c ./scripts/check-format.sh

  build-and-test:
    runs-on: macos-26
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Verify toolchain and dependency pins
        run: nix develop -c ./scripts/bootstrap.sh

      - name: Configure
        run: nix develop -c ./scripts/configure.sh ci

      - name: Build
        run: nix develop -c ./scripts/build.sh ci

      - name: Test
        run: nix develop -c ./scripts/test.sh ci

  release-policy:
    needs: build-and-test
    runs-on: macos-26
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Build and verify ad-hoc release
        run: |
          nix develop -c ./scripts/bootstrap.sh
          nix develop -c ./scripts/configure.sh release
          nix develop -c ./scripts/build.sh release
          nix develop -c ./scripts/verify-release.sh \
            build/release/Release/Shi-tate.app --allow-adhoc

      - name: Verify package and recursive source archive
        env:
          SHITATE_ARTIFACT_DIR: ${{ runner.temp }}/shitate-ci-artifacts
        run: |
          source scripts/lib/version.sh
          shitate_read_version_contract "$GITHUB_WORKSPACE"
          version=$SHITATE_VERSION
          nix develop -c ./scripts/package.sh release
          nix develop -c ./scripts/make-source-archive.sh "$version"
          nix develop -c ./scripts/verify-source-archive.sh \
            "$SHITATE_ARTIFACT_DIR/shitate-$version-source.tar.zst"
